name: Release

# Every push to main builds a signed Windows installer and publishes it as a
# GitHub Release. Installed copies poll releases/latest/download/latest.json
# on startup and update themselves.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # The updater only installs strictly newer versions, so each run gets its
      # own patch number: <major>.<minor> from tauri.conf.json, patch = run number.
      - name: Set version
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const path = "src-tauri/tauri.conf.json";
            const conf = JSON.parse(fs.readFileSync(path, "utf8"));
            const [major, minor] = conf.version.split(".");
            conf.version = `${major}.${minor}.${process.env.GITHUB_RUN_NUMBER}`;
            fs.writeFileSync(path, JSON.stringify(conf, null, 2));
            console.log(`Version ${conf.version}`);
          '

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Achievement Shelf v__VERSION__
          releaseBody: Built from ${{ github.sha }}. Installed copies update automatically on next launch.
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
