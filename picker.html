<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Choose trophies</title>
    <link rel="stylesheet" href="/src/picker.css" />
  </head>
  <body>
    <header class="bar">
      <div class="bar-title">
        <h1>Trophy shelf</h1>
        <span id="count" class="count"></span>
      </div>
      <input id="search" class="search" type="search" placeholder="Search achievements or games" autocomplete="off" />
      <button id="clear" class="clear" type="button">Clear all</button>
    </header>
    <p class="hint">Pick the achievements you are most proud of. They sit on the gold shelf above your recent unlocks.</p>
    <p id="status" class="status" hidden></p>
    <div class="content">
      <aside class="sidebar" aria-label="Games">
        <input id="game-filter" class="game-filter" type="search" placeholder="Filter games" autocomplete="off" />
        <nav id="games" class="games"></nav>
      </aside>
      <main id="list" class="list"></main>
    </div>
    <script type="module" src="/src/picker.ts"></script>
  </body>
</html>
