[package]
name = "achievement-shelf"
version = "0.1.0"
edition = "2021"
default-run = "achievement-shelf"

[lib]
name = "achievement_shelf_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
base64 = "0.22"
rusqlite = { version = "0.42.0", features = ["bundled"] }
tauri-plugin-updater = "2"
sha2 = "0.10"
getrandom = "0.3"
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
# Already used by Tauri; for dragging achievements out as image files (src/share.rs), signed-in
# accounts in Credential Manager (src/accounts.rs) and spotting running emulators (src/processes.rs).
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security_Credentials",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"

# Image decoding and resizing (Xbox icons, src/icons.rs) is ~30x slower unoptimised, so dev
# builds optimise those crates too.
[profile.dev.package]
image = { opt-level = 3 }
png = { opt-level = 3 }
fdeflate = { opt-level = 3 }
zune-jpeg = { opt-level = 3 }
zune-core = { opt-level = 3 }
crc32fast = { opt-level = 3 }
simd-adler32 = { opt-level = 3 }
miniz_oxide = { opt-level = 3 }
